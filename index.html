<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المشروع الأكاديمي لقسم الحوسبة والتكنولوجيا</title>
<meta name="description" content="المشروع الأكاديمي لقسم الحوسبة والتكنولوجيا: أتعلّم الطباعة وبرنامج Word">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a calm classroom "desk" — off-white paper ground, a maroon header band with a gold rule,
   big rounded tiles on a 2–5 column grid that collapses to one column on phones. Single light theme by design. */
:root{
  color-scheme: light;
  --paper:#F3FAFF; --paper-2:#E4F3FC; --card:#FFFFFF;
  --sky:#DDF4FB; --sky-2:#EFFAFE; --blue:#0B84C6; --blue-2:#7CCDF0;
  --maroon:#1F6FD1; --maroon-soft:#5B9BEA; --maroon-tint:#E3EEFD;
  --gold:#F5A524; --gold-soft:#FFF1CF;
  --ink:#1E2A3A; --muted:#5B6B7E; --line:#D6E6F2;
  --ok:#23845A; --ok-tint:#E2F3EA; --bad:#C2412F; --bad-tint:#FBE6E2; --warn:#B9770E; --warn-tint:#FCF1DC;
  --f-display:"Baloo Bhaijaan 2","Tajawal",Tahoma,Arial,sans-serif;
  --f-body:"Tajawal",Tahoma,"Segoe UI",Arial,sans-serif;
  --f-read-ar:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --f-read-en:"Andika","Comic Sans MS","Segoe UI",Arial,sans-serif;
  --r:18px; --r-sm:12px;
  --shadow:0 2px 0 rgba(31,111,209,.07),0 8px 24px rgba(42,36,48,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
.ltr{direction:ltr;text-align:left}
.rtl{direction:rtl;text-align:right}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* ===== Header ===== */
.top{background:var(--maroon);color:#fff;border-bottom:4px solid var(--gold);position:relative}
.top::after{content:"";position:absolute;inset:auto 0 -10px 0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 22px);opacity:.35}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 320px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:clamp(1.25rem,3.2vw,1.9rem);font-weight:800;letter-spacing:0}
.brand p{margin:0;font-size:clamp(.9rem,2vw,1.05rem);color:var(--gold-soft)}
.top-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 14px;font-size:.95rem;min-height:44px}
.chip:hover{background:rgba(255,255,255,.2)}
.chip[aria-pressed="false"]{opacity:.65}
@media (max-width:640px){.chip .lbl{display:none}.chip{padding:6px 12px}.top-tools{width:100%}}
.who{background:var(--gold-soft);color:var(--maroon);border-color:var(--gold);font-weight:700}

main{padding-block:26px 40px;min-height:60vh}
.foot{background:var(--paper-2);border-top:1px solid var(--line);text-align:center;padding-block:18px;color:var(--muted);font-size:.95rem}
.foot b{color:var(--maroon);font-family:var(--f-display);font-size:1.05rem}

/* ===== Common ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:14px;padding:10px 18px;min-height:48px;font-weight:700;background:var(--maroon);color:#fff;transition:transform .12s,background .12s}
.btn:hover{background:#185CB0}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--card);color:var(--maroon);border-color:var(--maroon-tint)}
.btn.alt:hover{background:var(--maroon-tint)}
.btn.blue{background:var(--blue)}
.btn.blue:hover{background:#22547F}
.btn.gold{background:var(--gold);color:#2A2430}
.btn.ghost{background:transparent;color:var(--maroon);border-color:transparent}
.btn.ghost:hover{background:var(--maroon-tint)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.danger{background:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;background:var(--sky);color:var(--blue);white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)} .pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.warn{background:var(--warn-tint);color:var(--warn)} .pill.m{background:var(--maroon-tint);color:var(--maroon)}
.pill.g{background:var(--gold-soft);color:#7A5A12}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.crumbs h2{font-size:clamp(1.4rem,3.5vw,2rem);color:var(--maroon)}
.listen{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--blue);border:0;border-radius:999px;padding:6px 14px;min-height:40px;font-weight:700}
.listen:hover{background:#cfe2f3}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:700;font-size:.92rem;color:var(--muted)}
.input,select.input,textarea.input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:46px;width:100%}
.input:focus{border-color:var(--blue-2);outline:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:4px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--maroon);border-color:var(--gold)}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.1rem;white-space:nowrap}
.stars .off{color:#DDD3C0}
.lock{opacity:.5;filter:grayscale(.6);pointer-events:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
table.data{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle;white-space:nowrap}
table.data th{background:var(--paper-2);color:var(--maroon);font-weight:700;position:sticky;top:0}
table.data td.wrapcell{white-space:normal;min-width:200px}
table.data tr:hover td{background:var(--sky-2)}

/* ===== Home tiles ===== */
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hello h2{font-size:clamp(1.5rem,4vw,2.2rem);color:var(--maroon)}
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:start;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:210px}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile .num{position:absolute;inset-inline-end:14px;top:10px;font-family:var(--f-display);color:var(--gold);font-size:1.6rem;font-weight:800;opacity:.55}
.tile h3{font-size:1.45rem;color:var(--maroon)}
.tile p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5}
.tile .ico{width:84px;height:84px}
.tile .bar{width:100%;height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-top:auto}
.tile .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--maroon-soft));border-radius:99px}

/* ===== Login ===== */
.picker{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;min-height:70px;font-weight:700;font-size:1.05rem;text-align:center}
.pick:hover,.pick.on{border-color:var(--maroon);background:var(--maroon-tint);color:var(--maroon)}
.step-title{font-family:var(--f-display);font-size:1.3rem;color:var(--maroon);margin:18px 0 10px}

/* ===== Typing ===== */
.track-tabs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lvl-head{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.lvl-head h3{color:var(--maroon);font-size:1.2rem}
.drills{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.drill{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:110px}
.drill:hover{border-color:var(--blue-2)}
.drill b{font-size:1.05rem}
.drill .prev{font-size:.95rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typing{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.target{font-size:clamp(1.6rem,4.6vw,2.4rem);line-height:2;background:var(--sky-2);border:2px dashed var(--blue-2);border-radius:18px;padding:16px 20px;white-space:pre-wrap;word-break:break-word;user-select:none}
.target.ar{font-family:var(--f-read-ar)} .target.en{font-family:var(--f-read-en)}
.target span{border-radius:6px;padding:0 1px}
.target .ok{color:var(--ok)}
.target .no{color:#fff;background:var(--bad)}
.target .cur{box-shadow:inset 0 -5px 0 var(--gold);background:var(--gold-soft)}
.target .sp.no{background:var(--bad)}
.target .nl{color:var(--blue-2);font-size:.7em}
.target .sp{display:inline-block;min-width:.45em}
.typebox{width:100%;min-height:110px;font-size:clamp(1.4rem,4vw,2rem);line-height:1.8;border:3px solid var(--blue-2);border-radius:18px;padding:12px 16px;background:#fff;resize:vertical}
.typebox.ar{font-family:var(--f-read-ar)} .typebox.en{font-family:var(--f-read-en)}
.typebox:focus{outline:none;border-color:var(--maroon)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:110px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--maroon);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.hint{background:var(--warn-tint);color:#7A4E08;border-radius:12px;padding:10px 14px;font-weight:700}
.kbd{direction:ltr;background:#EDE7DC;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;user-select:none;overflow-x:auto}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;min-width:30px;max-width:64px;height:54px;border:0;border-radius:9px;background:#fff;box-shadow:0 3px 0 #CFC5B4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.25rem;line-height:1;position:relative;padding:0}
.key small{font-size:.62rem;color:var(--muted);position:absolute;top:4px;inset-inline-start:6px;direction:ltr}
.key .ar{font-family:var(--f-read-ar)}
.key.w15{max-width:96px;flex-grow:1.5} .key.w2{max-width:120px;flex-grow:2} .key.w6{max-width:420px;flex-grow:6}
.key.next{background:var(--gold);color:#2A2430;box-shadow:0 3px 0 #8E6E22;animation:pulse 1s infinite}
.key.press{transform:translateY(2px);box-shadow:0 1px 0 #CFC5B4}
.key.home::after{content:"";position:absolute;bottom:6px;width:12px;height:3px;border-radius:2px;background:#B7AC99}
.key[data-f]{border-bottom:5px solid var(--fc)}
@keyframes pulse{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fingers{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.fingers i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:4px}
.finger-now{font-weight:800;color:var(--maroon)}

/* ===== Reading ===== */
.story-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.story-card{border:2px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;text-align:start;padding:0;display:flex;flex-direction:column}
.story-card:hover{border-color:var(--gold)}
.story-card svg{display:block;width:100%;height:auto;background:var(--sky-2)}
.story-card .meta{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.story-card b{font-family:var(--f-display);font-size:1.15rem;color:var(--maroon)}
.reader{display:grid;gap:18px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:860px){.reader{grid-template-columns:minmax(0,1fr)}}
.story-art{border-radius:18px;overflow:hidden;border:2px solid var(--line);background:var(--sky-2)}
.story-art svg{display:block;width:100%;height:auto}
.story-text{font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:2.15}
.story-text.ar{font-family:var(--f-read-ar)} .story-text.en{font-family:var(--f-read-en);line-height:1.9}
.story-text p{margin:0 0 .3em}
.story-text .s.reading{background:var(--gold-soft);border-radius:8px}
.qbox{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--paper)}
.qbox .q{font-weight:800;font-size:1.15rem;margin-bottom:8px}
.qbox.ar .q,.qbox.ar textarea{font-family:var(--f-read-ar)}
.qbox.en .q,.qbox.en textarea{font-family:var(--f-read-en)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;margin-top:8px}
.fb.ok{background:var(--ok-tint);color:var(--ok)} .fb.wait{background:var(--sky);color:var(--blue)} .fb.bad{background:var(--bad-tint);color:var(--bad)}
.audio-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== Coloring ===== */
.act-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.act{border:2px solid var(--line);border-radius:18px;background:#fff;padding:10px;text-align:start;display:flex;flex-direction:column;gap:6px}
.act:hover{border-color:var(--gold)}
.act canvas{width:100%;height:auto;border-radius:10px;background:#fff;border:1px solid var(--line)}
.studio{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 250px}
@media (max-width:900px){.studio{grid-template-columns:minmax(0,1fr)}}
.canvas-box{position:relative;width:100%;aspect-ratio:1000/707;max-width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none}
.canvas-box canvas{position:absolute;inset:0;width:100%;height:100%}
.canvas-box canvas.lines,.canvas-box canvas.guide{pointer-events:none}
.tools{display:flex;flex-direction:column;gap:12px}
.toolgroup{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolgroup h4{width:100%;font-size:.9rem;color:var(--muted);font-family:var(--f-body)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #CFC5B4;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.tbtn{min-height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;padding:4px 10px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tbtn.on{border-color:var(--maroon);background:var(--maroon-tint);color:var(--maroon)}
.size-dot{display:inline-block;border-radius:50%;background:var(--ink)}
.ref{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}
.ref svg{width:100%;height:auto;display:block}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.gallery figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{font-size:.8rem;padding:4px 8px;color:var(--muted)}

/* ===== Achievements ===== */
.badges{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.badge{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge.off{opacity:.55;filter:grayscale(1)}
.badge b{font-family:var(--f-display);color:var(--maroon);font-size:1.1rem}
.badge .prog{width:100%;height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden}
.badge .prog i{display:block;height:100%;background:var(--gold)}
.bigstars{font-family:var(--f-display);font-size:2.6rem;color:var(--gold);font-weight:800;line-height:1}

/* ===== Word simulation ===== */
.sim-flag{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:#6A4C0C;border:2px dashed var(--gold);border-radius:999px;padding:4px 14px;font-weight:800}
.wl{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 330px}
@media (max-width:980px){.wl{grid-template-columns:minmax(0,1fr)}}
.sim{border:1px solid #C9CFD8;border-radius:14px;overflow:hidden;background:#E9ECF1;min-width:0}
.sim-title{background:#2B579A;color:#fff;display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:.92rem;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.sim-title .doc{flex:1;text-align:center;opacity:.95}
.sim-title button{background:transparent;border:0;color:#fff;border-radius:6px;min-height:34px;padding:2px 8px}
.sim-title button:hover{background:rgba(255,255,255,.18)}
.sim-tabs{display:flex;gap:2px;background:#2B579A;padding:0 8px;overflow-x:auto}
.sim-tabs button{background:transparent;border:0;color:#E6EEF8;padding:6px 14px;font-size:.92rem;border-radius:6px 6px 0 0;white-space:nowrap;min-height:36px}
.sim-tabs button[aria-selected="true"]{background:#F3F3F3;color:#2B579A;font-weight:700}
.ribbon{background:#F3F3F3;border-bottom:1px solid #D4D4D4;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:.9rem}
.rgroup{display:flex;flex-direction:column;gap:4px;padding-inline:8px;border-inline-end:1px solid #D9D9D9}
.rgroup:last-child{border:0}
.rgroup .rr{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.rgroup .gl{font-size:.72rem;color:#6B6B6B;text-align:center;margin-top:auto}
.rb{min-width:36px;min-height:36px;border:1px solid transparent;border-radius:5px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:2px 6px;font-size:.95rem}
.rb:hover{background:#DDE6F2;border-color:#C4D3E6}
.rb.on{background:#C9DAF0;border-color:#9DB6D8}
.rb.pulse,.rsel.pulse{animation:glow 1.1s infinite;background:#FFF3C4;border-color:var(--gold)}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(194,154,62,.45)}}
.rsel{min-height:34px;border:1px solid #C8C8C8;border-radius:4px;background:#fff;padding:2px 6px;font-size:.88rem;max-width:150px}
.page-wrap{padding:22px 12px;overflow:auto;max-height:70vh;min-height:360px}
.page{background:#fff;max-width:720px;margin:0 auto;min-height:480px;padding:48px 52px;box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:Arial,Tahoma,sans-serif;font-size:16px;line-height:1.3;color:#111;outline:none}
@media (max-width:600px){.page{padding:24px 20px}}
.page p{margin:0 0 8px}
.page img{max-width:100%;cursor:pointer}
.page img.sel{outline:3px solid #2B579A;outline-offset:2px}
.page table{border-collapse:collapse;margin:8px 0}
.page td,.page th{border:1px solid #333;padding:6px 10px;min-width:60px;height:32px}
.page ul,.page ol{margin:0 0 8px;padding-inline-start:28px}
.imgbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF8E2;border-bottom:1px solid #E8D9A8;padding:6px 10px;font-size:.9rem}
.statusbar{background:#2B579A;color:#E6EEF8;font-size:.8rem;padding:3px 12px;display:flex;gap:16px}
.colorpop{display:flex;gap:4px;flex-wrap:wrap;max-width:190px}
.colorpop button{width:22px;height:22px;border-radius:4px;border:1px solid #999;padding:0;min-height:0}
.panel{display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.steps li .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
.steps li.done{border-color:var(--ok);background:var(--ok-tint)}
.steps li.done .n{background:var(--ok);color:#fff}
.steps li.now{border-color:var(--gold)}
.explain{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.ex-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ex-art{background:#F3F3F3;border-radius:10px;height:92px;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.ex-art .rb{background:#fff;border-color:#CCC}
.ex-art .rb.hl{background:#FFF3C4;border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,154,62,.4)}
.cursor{position:absolute;width:22px;height:22px;animation:point 2.4s ease-in-out infinite}
@keyframes point{0%{transform:translate(40px,30px)}45%,70%{transform:translate(0,0)}100%{transform:translate(40px,30px)}}
.skills{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.skill{border:2px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:120px}
.skill:hover{border-color:var(--blue-2)}
.skill b{font-size:1.05rem}
.tier{display:flex;gap:6px;flex-wrap:wrap}
.tier button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;min-height:40px}
.tier button[aria-pressed="true"]{border-color:var(--maroon);background:var(--maroon-tint);color:var(--maroon)}
.checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;gap:8px;align-items:center}
.checklist li::before{content:"○";color:var(--muted);font-weight:800}
.checklist li.ok::before{content:"✓";color:var(--ok)}

/* ===== Games ===== */
.games-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.game-card{border:3px solid var(--line);border-radius:22px;background:#fff;padding:16px;text-align:start;display:flex;flex-direction:column;gap:8px;min-height:200px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.game-card:hover{transform:translateY(-3px);border-color:var(--gc)}
.game-card .gico{font-size:2.6rem;line-height:1;width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--gc) 14%,#fff)}
.game-card b{font-family:var(--f-display);font-size:1.35rem;color:var(--gc)}
.game{max-width:980px;margin:0 auto}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;min-height:32px}
.goal-q{width:100%;font-family:var(--f-display);font-size:1.35rem;color:var(--maroon);background:#fff;border:2px solid var(--gold);border-radius:14px;padding:8px 14px}
.gbox{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid var(--gold);background:#DCEBF7;touch-action:none}
.gbox canvas{position:absolute;inset:0;width:100%;height:100%}
.gover{position:absolute;inset:0;background:rgba(251,248,242,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;overflow:auto}
.goal-opts{position:absolute;inset:0;pointer-events:none}
.goal-opt{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;max-width:28%;min-height:44px;border:3px solid #fff;background:rgba(42,36,48,.82);color:#fff;border-radius:14px;padding:6px 10px;font-weight:800;font-size:clamp(.72rem,1.7vw,1rem);line-height:1.3}
.goal-opt:hover{background:var(--maroon)}
.goal-opt.right{background:var(--ok)} .goal-opt.wrong{background:var(--bad)} .goal-opt.dim{opacity:.4}
.pad{display:flex;gap:12px;justify-content:center;margin-top:12px;direction:ltr}
.pad button{min-width:84px;min-height:68px;font-size:1.8rem;border-radius:18px;border:3px solid var(--line);background:#fff;touch-action:none;user-select:none}
.pad button:active{background:var(--maroon-tint);border-color:var(--maroon)}
.puz-wrap{display:grid;gap:16px;grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
@media (max-width:760px){.puz-wrap{grid-template-columns:minmax(0,1fr)}}
.puz-board{display:grid;gap:2px;background:var(--line);border:3px solid var(--gold);border-radius:14px;overflow:hidden;aspect-ratio:1;width:100%;max-width:420px}
.puz-board.complete{gap:0}
.puz-cell{background:#fff;position:relative;min-width:0;aspect-ratio:1}
.puz-cell:empty{background:repeating-linear-gradient(45deg,#fff 0 8px,#F4EFE5 8px 16px)}
.puz-cell .puz-piece{width:100%;height:100%;border-radius:0;border:0}
.puz-tray{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.puz-piece{aspect-ratio:1;border-radius:8px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:grab;touch-action:none;background-repeat:no-repeat}
.puz-piece.sel{outline:4px solid var(--gold)}
.puz-piece.ghost{position:fixed;z-index:70;pointer-events:none;opacity:.85}
.puz-piece.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ===== Modal / toast ===== */
.modal{position:fixed;inset:0;background:rgba(42,36,48,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--paper);border-radius:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px;border:3px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .box h3{color:var(--maroon);font-size:1.4rem;margin-bottom:10px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:520px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;z-index:60;text-align:center;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.note{background:var(--sky-2);border:1px solid var(--blue-2);border-radius:14px;padding:12px 16px}
.note h4{color:var(--blue);margin-bottom:6px;font-family:var(--f-body);font-weight:800}
.note ul{margin:0;padding-inline-start:20px}
.st-sel{min-height:34px;border-radius:8px;border:1px solid var(--line);padding:2px 6px;font-size:.85rem}

.confirm{display:inline-flex;gap:6px;align-items:center}

#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}

  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea.landscape-img img{width:100%;height:auto}
  .pa-page{page-break-after:always}
  .pa-page:last-child{page-break-after:auto}
}
.pa-doc{font-family:var(--f-body);color:#000}
.pa-doc h1{color:var(--maroon);font-size:22pt}
.pa-doc table{border-collapse:collapse;width:100%;font-size:11pt}
.pa-doc th,.pa-doc td{border:1px solid #888;padding:5px 7px;text-align:start}
.pa-doc th{background:#F4EFE5}

.val-num{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--maroon);color:#fff;font-family:var(--f-display);font-weight:800;border-bottom:3px solid var(--gold)}

.val-num.big{width:52px;height:52px;font-size:1.5rem;flex:none}
.val-ico{font-size:2.1rem;line-height:1}
.val-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}

.val-mean{background:var(--gold-soft);border-color:var(--gold);font-size:1.15rem}
.val-ex{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.val-ex .card{display:flex;gap:12px;align-items:flex-start;padding:14px}
.val-ex p{margin:0}
.val-motto{margin-top:22px;background:var(--maroon);color:var(--gold-soft);border-radius:16px;padding:14px;text-align:center;font-family:var(--f-display);font-size:1.15rem}

/* ================= الرسوم (SVG) ================= */
const SKIN = '#E6B58C', SKIN2 = '#C98F64';
function flagSVG(x, y, w, outline) {
  const h = w * 11 / 28, a = x + w * 0.24, b = x + w * 0.335;
  let d = `M${x} ${y} H${a}`;
  for (let i = 0; i < 9; i++) { d += ` L${b} ${y + (i * 2 + 1) * h / 18} L${a} ${y + (i * 2 + 2) * h / 18}`; }
  d += ` H${x} Z`;
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#8A1538"/><path d="${d}" fill="#fff"/>${outline ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#5a0d24" stroke-width="1.5"/>` : ''}</g>`;
}
function face(cy, r) {

}

const rr = (x, y, w, h, r) => `M${x + r} ${y} H${x + w - r} Q${x + w} ${y} ${x + w} ${y + r} V${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h} H${x + r} Q${x} ${y + h} ${x} ${y + h - r} V${y + r} Q${x} ${y} ${x + r} ${y} Z`;
const circ = (cx, cy, r) => `M${cx - r} ${cy} A${r} ${r} 0 1 0 ${cx + r} ${cy} A${r} ${r} 0 1 0 ${cx - r} ${cy} Z`;
const ell = (cx, cy, rx, ry) => `M${cx - rx} ${cy} A${rx} ${ry} 0 1 0 ${cx + rx} ${cy} A${rx} ${ry} 0 1 0 ${cx - rx} ${cy} Z`;
function starPath(cx, cy, R, r, n = 5) { let d = ''; for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R; d += (i ? 'L' : 'M') + (cx + rad * Math.cos(a)).toFixed(1) + ' ' + (cy + rad * Math.sin(a)).toFixed(1) + ' '; } return d + 'Z'; }
function keyGrid(x0, y0, cols, rows, kw, kh, gap) { let d = ''; for (let r = 0; r < rows.length; r++) { const n = rows[r], off = r * kw * .35; for (let c = 0; c < n; c++) d += rr(x0 + off + c * (kw + gap), y0 + r * (kh + gap), kw, kh, 6) + ' '; } return d; }
function flagLines() {
  const x = 120, y = 110, w = 700, h = 275, a = x + w * .24, b = x + w * .335;
  let z = `M${a} ${y}`; for (let i = 0; i < 9; i++) z += ` L${b} ${y + (i * 2 + 1) * h / 18} L${a} ${y + (i * 2 + 2) * h / 18}`;
  return [rr(84, 80, 24, 610, 8), circ(96, 70, 16), `M${x} ${y} H${x + w} V${y + h} H${x} Z`, z, circ(910, 110, 50), `M0 640 Q250 580 500 640 T1000 620`, `M560 500 q30 -40 70 -10 q40 -20 60 20 q30 0 30 25 h-180 q-10 -30 20 -35z`];
}

let toastTimer;

  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
}
function confetti() {
  if (!DB.settings.motion || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#cheer'); c.hidden = false; const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#8A1538', '#C29A3E', '#7FB0D9', '#23845A', '#fff'];
  const ps = Array.from({ length: 70 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight / 3, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, c: cols[Math.floor(Math.random() * 5)], r: Math.random() * 6 + 4 }));
  let f = 0; (function step() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .3; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r * .6); });
    if (++f < 80) requestAnimationFrame(step); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })();
}

function badgeProgress(sid) {
  const p = prog(sid), st = DB.students.find(s => s.id === sid) || student();
  const typingGood = Object.values(p.typing).filter(t => t.best >= 85).length;
  const games = Object.values(p.games || {}).filter(g => (g.stars || 0) >= 2).length;
  const arts = Object.keys(p.coloring).filter(k => p.coloring[k].done).length;
  const wordOK = wordGradeComplete(sid, st.grade) ? 1 : 0;
  const improve = p.improvements || 0;
  const v = { typing: typingGood, gamer: games, artist: arts, word: wordOK, improve };
  v.pioneer = ['typing', 'gamer', 'artist', 'word'].filter(k => v[k] >= BADGES.find(b => b.id === k).need).length;
  return v;
}
function checkBadges() {
  const sid = student().id, p = prog(sid), v = badgeProgress(sid); let newOnes = [];
  BADGES.forEach(b => { if (v[b.id] >= b.need && !p.badges[b.id]) { p.badges[b.id] = todayStr(); newOnes.push(b); } });
  if (newOnes.length) { save(); setTimeout(() => { celebrate(L('شارة جديدة: ', 'New badge: ') + newOnes.map(b => L(b.ar, b.en)).join('، ')); }, 600); }
}
function totalStars(sid) {
  const p = prog(sid); let s = 0;
  Object.values(p.typing).forEach(t => s += t.stars || 0);
  Object.values(p.games || {}).forEach(g => s += g.stars || 0);
  Object.values(p.coloring).forEach(c => s += c.stars || 0);
  Object.values(p.values || {}).forEach(c => s += c.stars || 0);
  Object.values(p.word).forEach(w => s += w.stars || 0);
  return s;
}

function sectionPct(key) {
  const p = prog();
  if (key === 'typing') return Object.keys(p.typing).length / TYPING.ar.filter(d => !d.bonus).length;
  if (key === 'color') return Object.values(p.coloring).filter(c => c.done).length / COLORING.length;
  if (key === 'word') { const sk = wordSkillsFor(student().grade); return sk.length ? sk.filter(s => p.word[s.id] && ['m', 'h'].includes(p.word[s.id].status)).length / sk.length : 0; }
  if (key === 'values') return Object.keys(prog().values || {}).length / VALUES.length;
  if (key === 'games') return Object.keys(p.games || {}).length / GAMES.length;
  return Object.keys(p.badges).length / BADGES.length;
}

function makeW(sim) {
  const page = sim.page, lg = sim.lg;
  const n = s => lg === 'ar' ? normAr(s) : String(s).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  const W = { lg, parts: sim.parts, saved: sim.saved, printed: sim.printed };
  W.text = () => n(page.innerText);
  W.page = () => page.innerText;
  W.has = s => (' ' + W.text() + ' ').includes(n(s));
  W.hasWord = w => W.text().split(' ').includes(n(w));
  W.paras = () => [...page.children].filter(e => e.nodeName !== 'UL' && e.nodeName !== 'OL' && e.nodeName !== 'TABLE').filter(e => e.innerText.trim() || e.querySelector('img'));
  W.paraHas = (i, w) => { const p = W.paras()[i]; return !!p && n(p.innerText).split(' ').includes(n(w)); };
  W.wc = p => (n(p.innerText).match(/\S+/g) || []).length;
  W.maxSent = () => Math.max(0, ...W.paras().map(p => (p.innerText.match(/[^.!؟?]+[.!؟?]/g) || []).filter(s => s.trim().split(/\s+/).length >= 2).length));
  W.selText = () => sim.range ? sim.range.toString() : '';
  W.selIs = t => n(W.selText()) === n(t);
  W.selHas = t => !!W.selText().trim() && n(W.selText()).includes(n(t));
  W.textEls = () => { const out = []; const tw = document.createTreeWalker(page, NodeFilter.SHOW_TEXT); let x; while ((x = tw.nextNode())) if (x.textContent.trim()) out.push(x); return out; };
  W.styled = (word, pred) => { const t = n(word); return W.textEls().some(tn => n(tn.textContent).includes(t) && pred(getComputedStyle(tn.parentElement), tn.parentElement)); };
  W.pt = s => parseFloat(s.fontSize) * .75;
  W.rgb = c => (c.match(/\d+(\.\d+)?/g) || [0, 0, 0]).slice(0, 3).map(Number);
  W.near = (c, hex, tol = 70) => { const [r, g, b] = W.rgb(c); const v = parseInt(hex.slice(1), 16); return Math.hypot(r - (v >> 16 & 255), g - (v >> 8 & 255), b - (v & 255)) < tol; };
  W.anyColored = () => W.textEls().some(tn => { const [r, g, b] = W.rgb(getComputedStyle(tn.parentElement).color); return Math.max(r, g, b) - Math.min(r, g, b) > 40 || Math.max(r, g, b) > 120; });
  W.anyBold = () => W.textEls().some(tn => +getComputedStyle(tn.parentElement).fontWeight >= 600);
  W.anyBig = pt => W.textEls().some(tn => W.pt(getComputedStyle(tn.parentElement)) >= pt);
  W.underlined = el => { while (el && el !== page) { const s = getComputedStyle(el); if ((s.textDecorationLine || s.textDecoration || '').includes('underline') || el.nodeName === 'U') return true; el = el.parentElement; } return false; };
  W.block = i => W.paras()[i];
  W.align = i => { const b = W.block(i); if (!b) return ''; const a = getComputedStyle(b).textAlign; return a === 'start' ? (getComputedStyle(b).direction === 'rtl' ? 'right' : 'left') : a; };
  W.indent = i => { const b = W.block(i); if (!b) return 0; const s = getComputedStyle(b); return Math.max(parseFloat(s.marginLeft) || 0, parseFloat(s.marginRight) || 0, parseFloat(s.paddingInlineStart) || 0, parseFloat(s.textIndent) || 0); };
  W.lineH = i => { const b = W.block(i); if (!b) return 0; const s = getComputedStyle(b); if (b.style.lineHeight) return parseFloat(b.style.lineHeight); return s.lineHeight === 'normal' ? 1.2 : parseFloat(s.lineHeight) / parseFloat(s.fontSize); };
  W.after = i => { const b = W.block(i); return b ? parseFloat(getComputedStyle(b).marginBottom) || 0 : 0; };
  W.border = i => { const b = W.block(i); if (!b) return false; const s = getComputedStyle(b); return s.borderTopStyle !== 'none' && parseFloat(s.borderTopWidth) > 0; };
  W.shade = i => { const b = W.block(i); if (!b) return false; const c = getComputedStyle(b).backgroundColor; return c && c !== 'transparent' && !/rgba\(0, 0, 0, 0\)/.test(c) && !/255, 255, 255\)$/.test(c); };
  W.caretIn = i => { const b = W.block(i); return !!(b && sim.range && b.contains(sim.range.startContainer)); };
  W.imgs = () => [...page.querySelectorAll('img')];
  W.resized = img => +img.getAttribute('width') !== +(img.dataset.w0 || 240) || img.width !== +(img.dataset.w0 || 240);
  W.table = (r, c) => [...page.querySelectorAll('table')].some(t => t.rows.length >= r && [...t.rows].every(row => row.cells.length >= c));
  W.cells = () => [...page.querySelectorAll('td,th')];
  W.filledCells = () => W.cells().filter(c => c.innerText.trim()).length;
  W.allCellsFilled = () => W.cells().length > 0 && W.cells().every(c => c.innerText.trim());
  W.headerBold = () => { const t = page.querySelector('table'); if (!t) return false; return [...t.rows[0].cells].every(c => !c.innerText.trim() || +getComputedStyle(W.deepest(c)).fontWeight >= 600); };
  W.list = (tag, k) => [...page.querySelectorAll(tag)].some(l => [...l.querySelectorAll('li')].filter(li => li.innerText.trim()).length >= k);
  W.deepest = el => { const tns = []; const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let x; while ((x = tw.nextNode())) if (x.textContent.trim()) tns.push(x); return tns.length ? tns[0].parentElement : el; };

  const nameParts = () => { const st = student(); return st.name.replace(/^مثال:\s*/, '').split(/\s+/).filter(x => x.length > 1); };
  W.hasName = () => { const parts = nameParts(); if (student().guest) return W.wc({ innerText: page.innerText }) >= 1; return parts.length ? W.has(parts[0]) : W.text().length > 0; };
  W.docNameChanged = () => { const v = ($('#docName') || {}).value || ''; return v.trim() && v !== sim.docName0; };
  W.valueWordCount = () => { const words = new Set(VALUE_WORDS[lg].map(n)); return new Set(W.text().split(' ').filter(w => words.has(w))).size; };
  return W;
}

function exportExcel(list) {
  list = list || myStudents();
  if (!window.XLSX) return toast('مكتبة Excel غير محمّلة (تحتاج اتصالًا بالإنترنت أول مرة).');
  const wb = XLSX.utils.book_new();
  const sum = [['الاسم', 'الصف', 'الشعبة', 'تدريبات الطباعة', 'متوسط الدقة %', 'أعلى سرعة', 'الألعاب', 'نجوم الألعاب', 'التلوين', 'Word أتقن', 'Word بمساعدة', 'Word دعم', 'المشروع الختامي', 'النجوم', 'الشارات']];
  list.forEach(s => { const x = stuSummary(s); sum.push([s.name, s.grade, s.section, x.typingDone, x.typingAcc, x.wpm || '', x.games, x.gameStars, x.coloring, x.wm, x.wh, x.ws, x.final ? STATUS_NAME[x.final][0] : '', x.stars, x.badges.join('، ')]); });
  const typ = [['الاسم', 'التدريب', 'اللغة', 'المستوى', 'أفضل دقة', 'آخر دقة', 'السرعة', 'المحاولات', 'التاريخ']];
  list.forEach(s => { const p = prog(s.id); [...TYPING.ar, ...TYPING.en].forEach(d => { const r = p.typing[d.id]; if (r) typ.push([s.name, d.title, d.id.startsWith('ar') ? 'العربية' : 'English', d.lvl, r.best, r.last, r.wpm || '', r.attempts, r.date]); }); });
  const cols = [...WORD_SKILLS, ...PROJECTS, { id: 'final', title: { ar: 'المشروع الختامي' } }];
  const wd = [['الاسم', 'الصف', ...cols.map(c => c.title.ar)]];
  list.forEach(s => { const p = prog(s.id); wd.push([s.name, s.grade, ...cols.map(c => { const r = p.word[c.id]; const v = r ? (r.teacherStatus || r.status) : ''; return v ? STATUS_NAME[v][0] : ''; })]); });

  const gm = [['الاسم', 'اللعبة', 'أفضل نتيجة', 'النجوم', 'مرات اللعب', 'التاريخ']];
  list.forEach(s => { const p = prog(s.id); GAMES.forEach(g => { const r = (p.games || {})[g.id]; if (r) gm.push([s.name, g.ar, r.best, r.stars, r.plays, r.date]); }); });
  [['الملخص', sum], ['الطباعة', typ], ['الألعاب', gm], ['مهارات Word', wd], ['التلوين', col]].forEach(([n, a]) => { const ws = XLSX.utils.aoa_to_sheet(a); ws['!cols'] = a[0].map((h, i) => ({ wch: i === 0 ? 22 : Math.max(10, String(h).length + 2) })); XLSX.utils.book_append_sheet(wb, ws, n); });
  wb.Workbook = { Views: [{ RTL: true }] };
  try { const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' }); downloadBlob(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `تقرير رواد التكنولوجيا ${todayStr()}.xlsx`); } catch (e) { toast('تعذّر إنشاء ملف Excel.'); }
}

function mergeDB(d) {
  (d.teachers || []).forEach(t => { if (!DB.teachers.find(x => x.id === t.id)) DB.teachers.push(t); });
  (d.students || []).forEach(s => { if (!DB.students.find(x => x.id === s.id)) DB.students.push(s); });
  Object.entries(d.progress || {}).forEach(([sid, p]) => {
    const mine = DB.progress[sid]; if (!mine) { DB.progress[sid] = p; return; }
    Object.entries(p.typing || {}).forEach(([k, r]) => { const m = mine.typing[k]; if (!m || r.best > m.best) mine.typing[k] = r; });
    mine.games = mine.games || {}; Object.entries(p.games || {}).forEach(([k, r]) => { const m = mine.games[k]; if (!m || (r.best || 0) > (m.best || 0)) mine.games[k] = r; });
    Object.entries(p.coloring || {}).forEach(([k, r]) => { if (!mine.coloring[k] || (r.stars || 0) > (mine.coloring[k].stars || 0)) mine.coloring[k] = r; });
    const rank = { m: 3, h: 2, s: 1 };
    Object.entries(p.word || {}).forEach(([k, r]) => { const m = mine.word[k]; if (!m || (rank[r.teacherStatus || r.status] || 0) > (rank[m.teacherStatus || m.status] || 0)) mine.word[k] = r; });
    Object.assign(mine.badges, p.badges || {});
    const ids = new Set(mine.gallery.map(g => g.id)); (p.gallery || []).forEach(g => { if (!ids.has(g.id)) mine.gallery.push(g); }); while (mine.gallery.length > 8) mine.gallery.shift();
  });
  Object.assign(DB.storyEdits, d.storyEdits || {});
  Object.entries(d.wordDocs || {}).forEach(([k, v]) => { DB.wordDocs[k] = Object.assign({}, v, DB.wordDocs[k] || {}); });
}

function viewValues(v, p) {
  const pr = prog(); pr.values = pr.values || {};
  if (p.id) return valueDetail(v, VALUES.findIndex(x => x.id === p.id));
  v.innerHTML = crumbs(T('s_values'), 'home') + `
    <p class="muted">${L('عزيزي الطالب.. هذه قيم مدرستنا. اختر قيمة لتتعرّف معناها وأمثلتها، ثم أجب عن المواقف لتربح النجوم.', 'These are our school values. Pick one to learn its meaning and examples, then answer the situations to earn stars.')}</p>
    <div class="val-grid">${VALUES.map((x, i) => { const r = pr.values[x.id]; return `<button class="val-card" data-go="values" data-p='{"id":"${x.id}"}'><span class="val-num">${i + 1}</span><span class="val-ico">${x.ico}</span><b>${L(x.ar, x.en)}</b>${r ? starsHTML(r.stars) : `<span class="pill g">${L('ابدأ', 'Start')}</span>`}</button>`; }).join('')}</div>
    <div class="val-motto">🌿 ${L('معًا.. نغرس القيم، ونبني جيلًا واعيًا ومسؤولًا', 'Together we plant values and raise an aware, responsible generation')} 🌿</div>`;
}
function valueDetail(v, i) {
  const x = VALUES[i]; const pr = prog(); const ans = [];
  const prev = VALUES[i - 1], next = VALUES[i + 1];
  const nav = (o, lbl) => o ? `<button class="btn alt sm" data-go="values" data-p='{"id":"${o.id}"}'>${lbl}</button>` : '';
  v.innerHTML = crumbs(`${x.ico} ${L('القيمة', 'Value')} ${i + 1}`, 'values') + `
    <div class="val-head"><span class="val-num big">${i + 1}</span><h3>${L(x.ar, x.en)}</h3></div>
    <div class="card val-mean"><b>${L('معناها:', 'What it means:')}</b> ${L(x.mAr, x.mEn)}</div>
    <h4 class="step-title">${L('أمثلة من حياتي', 'Examples from my life')}</h4>
    <div class="val-ex">${x.ex.map(e => `<div class="card"><span class="val-ico">${e[0]}</span><p>${L(e[1], e[2])}</p></div>`).join('')}</div>
    <h4 class="step-title">${L('ماذا أفعل؟ هل هذا السلوك صحيح؟', 'Is this the right behaviour?')}</h4>
    <div class="stack" id="valQ">${x.q.map((q, k) => `<div class="qbox" data-k="${k}"><div class="q">${L(q[0], q[1])}</div><div class="row"><button class="btn sm" data-a="1">👍 ${L('صحيح', 'Right')}</button><button class="btn alt sm" data-a="0">👎 ${L('خطأ', 'Wrong')}</button></div><div class="fb-slot"></div></div>`).join('')}</div>
    <div class="row" style="margin-top:20px">${nav(next, L('القيمة التالية ←', 'Next value →'))}<span class="spacer"></span>${nav(prev, L('→ القيمة السابقة', '← Previous value'))}</div>`;
  $('#valQ').onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const box = b.closest('.qbox'); const k = +box.dataset.k; if (ans[k] !== undefined) return;
    const ok = +b.dataset.a === x.q[k][2]; ans[k] = ok;
    $$('[data-a]', box).forEach(btn => btn.disabled = true);
    box.querySelector('.fb-slot').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? L('أحسنت! 🌟', 'Well done! 🌟') : L('فكّر مرة أخرى: ', 'Think again: ') + (x.q[k][2] ? L('هذا سلوك صحيح.', 'this is the right thing to do.') : L('هذا سلوك غير صحيح.', 'this is not the right thing to do.'))}</div>`;
    chime(ok ? 'ok' : 'no');
    if (ans.filter(a => a !== undefined).length === x.q.length) {
      const stars = ans.filter(Boolean).length; const o = (pr.values || {})[x.id] || { stars: 0 };
      pr.values[x.id] = { stars: Math.max(o.stars, stars), date: todayStr() }; save(); checkBadges();
      if (stars === 3) celebrate(L('ممتاز! عرفت قيمة جديدة ⭐⭐⭐', 'Excellent! ⭐⭐⭐')); else toast(L(`حصلت على ${stars} من 3 نجوم. يمكنك المحاولة مرة أخرى.`, `You got ${stars} of 3 stars. Try again any time.`));
    }
  };
}
